<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>VICE COVER STUDIO</h1>
    <p class="tagline">Your photo and a caption, made into GTA-style cover art. Works fully offline.</p>

    <section class="group">
      <h2>Layout</h2>
      <div class="choices" id="layouts"></div>
    </section>

    <section class="group">
      <h2>Colour grade</h2>
      <div class="choices" id="grades"></div>
    </section>

    <section class="group">
      <h2>Words</h2>
      <label>Caption
        <input id="caption" type="text" maxlength="24" value="VICE HEAT">
      </label>
      <label>Subtitle
        <input id="subtitle" type="text" maxlength="40" value="Leonida &bull; 2026">
      </label>
    </section>

    <section class="group">
      <h2>Photo</h2>
      <div class="choices" id="panels"></div>
      <label class="file">Upload a photo
        <input id="upload" type="file" accept="image/*">
      </label>
      <div class="row">
        <button type="button" data-sample="boulevard">Boulevard</button>
        <button type="button" data-sample="pier">Pier</button>
      </div>
      <label>Zoom
        <input id="zoom" type="range" min="0" max="300" value="0">
      </label>
      <div class="row">
        <button id="centre" type="button">Centre photo</button>
        <button id="applyAll" type="button">Same photo in all panels</button>
      </div>
      <p class="hint">Click a panel in the preview to select it. Drag to move its photo, scroll to zoom.</p>
    </section>

    <section class="group">
      <h2>Export</h2>
      <label>Size
        <select id="size"></select>
      </label>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </section>

  <section class="stage" aria-label="Live preview">
    <canvas id="preview" aria-label="Live preview of the cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
